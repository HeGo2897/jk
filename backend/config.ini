; ------------------------------------------------------------------
;  NEXA TASK backend configuration
;  Any value can be overridden with an environment variable
;  NEXA_<SECTION>_<KEY>, e.g. mysql.password -> NEXA_MYSQL_PASSWORD
; ------------------------------------------------------------------

[server]
host = 127.0.0.1
port = 8080

[database]
; sqlite = one file, nothing to install (default)
; mysql  = MySQL server (also run:  pip install pymysql)
type = sqlite
sqlite_path = nexa_tasks.db

[mysql]
host = localhost
port = 3306
name = todo_database
user = root
password = CHANGE_ME

[app]
; Insert 5 demo tasks the first time the tables are created
seed_sample_data = true
; Folder that contains index.html (relative to the backend folder)
frontend_dir = ../frontend
